<!-- How CAST Games Works (17 Oct 2026, the owner): a tap on The Sports or Welcome banner, anywhere but its button, opens
     the tour (shared/cg-tour.js, css/cg-tour.css), loaded on that first tap. castgames.com.au/#how-it-works opens it too.
     Once by itself for anyone who hasn't seen it (18 Oct 2026): loaded after the page, then CGTour.auto waits for a quiet
     home. tools/build.py keeps the two versions up to date -->
<script>
(function () {
  var F = ['css/cg-tour.css?v=55a176b4', 'shared/cg-tour.js?v=2fb30a8d'], wait = 0, want = '';
  function go() { var T = window.CGTour; if (T) { if (want === 'auto') T.auto(); else T.open(want); } }
  function open(from) {
    want = from;
    if (window.CGTour) { go(); return; }
    if (wait) return;
    wait = 2;
    var done = function () { if (--wait === 0) go(); }, fail = function () { wait = 0; };
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = F[0]; l.onload = done; l.onerror = fail; document.head.appendChild(l);
    var s = document.createElement('script'); s.src = F[1]; s.onload = done; s.onerror = fail; document.body.appendChild(s);
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.cgb.is-sports, .cgb.is-welcome');
    if (!b || e.target.closest('.cgb-b')) return; // their buttons (See All Games, Start Playing) still go to All Games
    e.preventDefault(); e.stopPropagation();
    open(b.classList.contains('is-welcome') ? 'welcome' : 'hero');
  }, true);
  var seen = '1'; try { seen = localStorage.getItem('cg_tour_seen_v1'); } catch (e) { /* storage blocked: never by itself */ }
  window.addEventListener('load', function () {
    if (location.hash === '#how-it-works') open('link');
    else if (!seen && !window.CG_SPORT) setTimeout(function () { if (!want) open('auto'); }, 1500);
  });
})();
</script>
